    value: { earliest: '2026-08-15', latest: '2026-08-31' }
    verification_status: user_confirmed
    provenance: [{ source_type: user_statement, source_ref: initial_project_specification }]
  # Optional adaptive-date fields consumed by packages/core/src/availability.ts.
  # Example uses placeholder dates; the real values live in the ignored local
  # workspace/profile.yml, never in this public fixture.
  relocation_date:
    value: null
    verification_status: unknown
    provenance: []
  available_from:
    value: null
    verification_status: unknown
    provenance: []
transport:
