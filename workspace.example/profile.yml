    value: fallback_only
    verification_status: user_confirmed
    provenance: [{ source_type: user_statement, source_ref: initial_project_specification }]
locations:
  city:
    value: { name: Frankfurt, country: Germany }
    verification_status: user_confirmed
    provenance: [{ source_type: user_statement, source_ref: initial_project_specification }]
  radius_km:
    value: 80
    verification_status: user_confirmed
    provenance: [{ source_type: user_statement, source_ref: initial_project_specification }]
  public_transport_required:
    value: true
    verification_status: user_confirmed
    provenance: [{ source_type: user_statement, source_ref: initial_project_specification }]
availability:
