    value: allowed_if_role_is_not_high_stress
    verification_status: user_confirmed
    provenance: [{ source_type: user_statement, source_ref: initial_project_specification }]
  continuous_heavy_work:
    value: avoid_continuous_heavy_work; occasional lifting and carrying is acceptable
    verification_status: user_confirmed
    provenance: [{ source_type: user_statement, source_ref: initial_project_specification }]
compensation:
  net_monthly_estimate:
    value: { floor_eur: 1750, target_eur: 2000 }
    verification_status: user_confirmed
    provenance: [{ source_type: user_statement, source_ref: initial_project_specification }]
