schema_version: 1
identity:
  name: { value: null, verification_status: unknown, provenance: [] }
  email: { value: null, verification_status: unknown, provenance: [] }
  phone: { value: null, verification_status: unknown, provenance: [] }
targets:
  primary_archetypes:
    value: [DCT_A, DCT_AT]
    verification_status: user_confirmed
    provenance: [{ source_type: user_statement, source_ref: initial_project_specification }]
  fallback_archetypes:
    value: [F]
    verification_status: user_confirmed
    provenance: [{ source_type: user_statement, source_ref: initial_project_specification }]
